spring:
  application:
    name: ecom-order-service

server:
  port: 8082

logging:
  level:
    com.dev.ecom_order_service.client: DEBUG
    com.netflix.discovery: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    lease-renewal-interval-in-seconds: 5