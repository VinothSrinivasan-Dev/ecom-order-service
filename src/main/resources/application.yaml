spring:
  application:
    name: ecom-order-service

server:
  port: 8082

logging:
  level:
    com.dev.ecom_order_service.client: DEBUG
    com.netflix.discovery: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    lease-renewal-interval-in-seconds: 30

resilience4j:
  ratelimiter:
    instances:
      inventoryService:
        limit-for-period: 2 #2 requests per 10 second
        limit-refresh-period: 10s # 10 seconds to refresh limits
        timeout-duration: 0s  # if request rejected how much time let this to be in rejected state